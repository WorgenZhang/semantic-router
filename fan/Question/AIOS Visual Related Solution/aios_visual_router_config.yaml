    stream_refs:
      - camera: "FWC"
        fps: 1
        required: true
      - camera: "SCF_L"
        fps: 0.5
        required: false
      - camera: "SCF_R"
        fps: 0.5
        required: false
    model_pipeline:
      type: "only_vit"
      stages:
        - name: "vit_stage"
          backbone: "backbone_b"
          heads: ["head_b5_scenery"]
      fusion:
        strategy: "none"
    multi_stream:
      strategy: "primary_secondary"
      primary: "FWC"
      primary_confidence_threshold: 0.7
    scheduling:
      frequency_hz: 1
      max_latency_ms: 1000
      preemptible: true
    power_config:
      min_power_mode: "normal"
      degradation:
        disable_entirely: true
        reason: "lowest priority, disable under resource pressure"

  - name: "uc3_camera_gallery"
    description: "Camera and gallery - beauty scene auto-capture"
    priority: 40
    tier: "enhancement"
    rules:
      operator: "AND"
      conditions:
        - type: "scene"
          name: "driving"
        - operator: "NOT"
          conditions:
            - type: "system"
              signal: "adas_critical_event"
              value: true
    stream_refs:
      - camera: "FWC"
        fps: 0.5
        required: true
      - camera: "SCF_L"
        fps: 0.5
        required: false
      - camera: "SCF_R"
        fps: 0.5
        required: false
    model_pipeline:
      type: "only_vit"
      stages:
        - name: "vit_stage"
          backbone: "backbone_b"
          heads: ["head_b5_scenery"]
      fusion:
        strategy: "none"
    multi_stream:
      strategy: "single"
      primary: "FWC"
    scheduling:
      frequency_hz: 0.5
      max_latency_ms: 2000
      preemptible: true
    power_config:
      min_power_mode: "normal"
      degradation:
        disable_entirely: true

  - name: "uc4_game_gesture"
    description: "Gaming gesture recognition control"
    priority: 30
    tier: "enhancement"
    rules:
      operator: "AND"
      conditions:
        - type: "scene"
          name: "in_cabin"
        - type: "system"
          signal: "game_mode_active"
          value: true
    stream_refs:
      - camera: "MPIC"
        fps: 15
        required: true
    model_pipeline:
      type: "only_cv"
      stages:
        - name: "cv_stage"
          models: ["cv_gesture_recognition"]
      fusion:
        strategy: "none"
    multi_stream:
      strategy: "single"
      primary: "MPIC"
    scheduling:
      frequency_hz: 15
      max_latency_ms: 67
      preemptible: true
    power_config:
      min_power_mode: "normal"
      degradation:
        reduce_fps_to: 10
        disable_on_resource_conflict: true

# =============================================================================
# Scheduling Configuration
# =============================================================================
scheduling:
  npu_config:
    max_concurrent_models: 1  # NPU constraint: one model at a time
    scheduling_strategy: "priority_preempt"
    time_slice_ms: 30  # Per-model inference time slice

  priority_preemption:
    enabled: true
    safety_tier_preempts_all: true
    min_execution_guarantee_ms: 10  # Even low-priority gets at least this

  resource_conflict_resolution:
    same_backbone_shared: true  # UC sharing backbone_b don't conflict
    multi_head_parallel: true  # Multiple heads on same backbone output run in parallel

# =============================================================================
# Scene Transition Rules
# =============================================================================
scene_transitions:
  - from: "driving"
    to: "parking"
    actions:
      keep: ["MPIC", "FWC"]
      add: ["SVC_F", "SVC_R", "SVC_L", "SVC_R2", "RVC"]
      reduce_fps: ["SCF_L", "SCF_R", "SCR_L", "SCR_R"]
      remove: ["FTC"]
      model_changes:
        deactivate_heads: ["head_b3_special_vehicle"]
        activate_heads: ["head_c1_person_presence", "head_c2_spot_status"]

  - from: "driving"
    to: "sentry_mode"
    actions:
      keep: []
      add: ["SVC_F", "SVC_R", "SVC_L", "SVC_R2"]
      remove: ["FWC", "FTC", "MPIC", "SCF_L", "SCF_R", "SCR_L", "SCR_R", "RVC"]
      model_changes:
        deactivate_all_backbones: true
        activate_models: ["cv_human_detection", "cv_motion_detection"]

  - from: "sentry_mode"
    to: "out_cabin"
    actions:
      keep: ["SVC_F", "SVC_R", "SVC_L", "SVC_R2"]
      add: ["SCF_L", "SCF_R"]
      model_changes:
        activate_models: ["cv_face_id"]

  - from: "parking"
    to: "driving"
    actions:
      keep: ["MPIC", "FWC"]
      add: ["FTC", "SCF_L", "SCF_R", "SCR_L", "SCR_R"]
      remove: ["SVC_F", "SVC_R", "SVC_L", "SVC_R2", "RVC"]
      model_changes:
        deactivate_heads: ["head_c1_person_presence", "head_c2_spot_status", "head_c3_event_type"]
        activate_heads: ["head_b1_weather", "head_b2_lighting", "head_b3_special_vehicle", "head_b4_scene_type"]
