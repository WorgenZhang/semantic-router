    stream_refs:
      - camera: "FWC"
        fps: 1
        required: true
      - camera: "SCF_L"
        fps: 1
        required: false
      - camera: "SCF_R"
        fps: 1
        required: false
    model_pipeline:
      type: "only_vit"
      stages:
        - name: "vit_stage"
          backbone: "backbone_b"
          heads: ["head_b4_scene_type"]
          description: "Gate/toll booth recognition via ViT scene classification"
      fusion:
        strategy: "none"
    multi_stream:
      strategy: "primary_secondary"
      primary: "FWC"
    scheduling:
      frequency_hz: 1
      max_latency_ms: 2000
      preemptible: true
    power_config:
      min_power_mode: "normal"
      degradation:
        disable_entirely: true

  - name: "uc8_scenery_recognition"
    description: "AI scenery recognition (landmarks, nature, sunset)"
    priority: 40
    tier: "enhancement"
    rules:
      operator: "AND"
      conditions:
        - type: "scene"
          name: "driving"
        - type: "vehicle"
          signal: "speed"
          operator: ">"
          value: 30
        - operator: "NOT"
          conditions:
            - type: "system"
